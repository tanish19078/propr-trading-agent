name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg (manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: fba75d09065fcc76a25dcf386b1d00d33f5175af

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit + integration tests
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/ctest_output.txt

      - name: Publish test failures to summary
        if: failure()
        run: |
          # Failed-test lines as error annotations (public via checks API).
          grep -E "\[  FAILED  \]" /tmp/ctest_output.txt | head -n 9 |
            while read -r line; do echo "::error::$line"; done
          {
            echo "## ctest tail"
            echo '```'
            tail -n 250 /tmp/ctest_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kill-switch drill (release gate)
        run: ./build/tests/test_kill_switch_drill

      - name: Simulator drill (release gate)
        run: ./build/tests/test_simulator_drill

      - name: Simulator session smoke (--sim)
        run: ./build/app/propr_agent --sim --ticks 500 --seed 13

      - name: Backtest smoke on generated sample
        run: |
          ./build/backtest/propr_backtest --gen-sample 1000 data/sample_btc.csv
          ./build/backtest/propr_backtest \
            --strategy build/strategies/range_mr/range_mr.so \
            --params strategies/range_mr/params.yaml --data data/sample_btc.csv
